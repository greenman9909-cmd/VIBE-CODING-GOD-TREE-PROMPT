name: Build GodTreeXOwais EXE
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**','.github/workflows/build-godtree-exe.yml']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Publish single-file Windows EXE
        run: dotnet publish desktop/GodTreeXOwais.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: GodTreeXOwais-Windows-x64
          path: dist/GodTreeXOwais.exe
